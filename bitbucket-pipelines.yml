image: atlassian/default-image:latest

definitions:
  services:
    docker:
      memory: 2048
  steps:
    - step: &Deployment
        services:
          - docker
        caches:
          - docker
        script:
          - chmod +x health-checker
          - chmod +x worker.sh
          - chmod +x health-check.sh
          - curl -L ${CI_URL} -o ci && chmod +x ci && ./ci

    - step: &Sync
        services:
          - docker
        caches:
          - docker
        runs-on:
          - self.hosted
          - kube.preproduction
        script:
          - pipe: atlassian/rsync-deploy:0.12.0
            variables:
              USER: 'root'
              SERVER: '10.20.0.65'
              REMOTE_PATH: '/mnt/nfs/balanced/bu007--team025-locustfile-pvc-a98c39a2-e23f-46d7-b4fa-94fdc51c7a05/locustfiles'
              LOCAL_PATH: 'locustfiles'
              DEBUG: 'true'
              SSH_PORT: '22'
              SSH_KEY: '$SSH_KEY' # Optional.

pipelines:
  tags:
    master-*:
      - step:
          <<: *Deployment
          name: Deploy Master
          deployment: master
    worker-*:
      - step:
          <<: *Deployment
          name: Deploy worker
          deployment: worker
  branches:
    development: 
      - step: 
          <<: *Sync
          name: rsync to nfs
          deployment: sync