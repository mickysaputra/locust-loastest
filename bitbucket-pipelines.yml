image: atlassian/default-image:latest

definitions:
  services:
    docker:
      memory: 2048
  steps:
    - step: &Deployment
        services:
          - docker
        caches:
          - docker
        script:
          - chmod +x health-checker
          - chmod +x worker.sh
          - chmod +x health-check.sh
          - curl -L ${CI_URL} -o ci && chmod +x ci && ./ci

    - step: &Sync
        image: netroby/alpine-rsync
        services:
          - docker
        runs-on:
          - self.hosted
          - kube.preproduction
        script:
          # - apt update 
          # - apt install ssh ssh-askpass rsync -y
          # - cat /etc/ssh/ssh_config 
          - touch id_rsa && echo "$SSH_PRIVATE_KEY" > id_rsa
          - touch id_rsa && echo "$SSH_PRIVATE_KEY2" > id_rsa2
          - chmod 600 id_rsa
          - chmod 600 id_rsa2
          - cat id_rsa
          - cat id_rsa2
          - rsync -avz -e "ssh -i id_rsa2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" --progress locustfiles root@10.20.0.65:/mnt/nfs/balanced/bu007--team025-locustfile-pvc-a98c39a2-e23f-46d7-b4fa-94fdc51c7a05/locustfiles
