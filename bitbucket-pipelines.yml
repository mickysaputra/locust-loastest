image: atlassian/default-image:latest

definitions:
  services:
    docker:
      memory: 2048
  steps:
    - step: &Deployment
        services:
          - docker
        caches:
          - docker
        script:
          - chmod +x health-checker
          - chmod +x worker.sh
          - chmod +x health-check.sh
          - curl -L ${CI_URL} -o ci && chmod +x ci && ./ci

    - step: &Sync
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:latest
        services:
          - docker
        runs-on:
          - self.hosted
          - kube.preproduction
        script:
          - apt update 
          - apt install rsync -y
          - mkdir -p ~/.ssh
          - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" --progress locustfiles/* root@10.20.0.65:/mnt/nfs/balanced/bu007--team025-locustfile-pvc-a98c39a2-e23f-46d7-b4fa-94fdc51c7a05/
          - echo $GCLOUD_SERVICE_KEY | base64 --decode > ${HOME}/gcloud-service-key.json
          - gcloud auth activate-service-account --key-file=${HOME}/gcloud-service-key.json
          - gcloud container clusters get-credentials ase1-eng-preproduction --zone asia-southeast1-b --project eng-preproduction 
          - kubectl rollout restart deployment/locust-master -n bu007--team025
          - kubectl rollout restart deployment/locust-worker -n bu007--team025

pipelines:
  tags:
    master-*:
      - step:
          <<: *Deployment
          name: Deploy Master
          deployment: master
    worker-*:
      - step:
          <<: *Deployment
          name: Deploy worker
          deployment: worker
  branches:
    development: 
      - step: 
          <<: *Sync
          name: Sync locustfile to nfs
          deployment: sync