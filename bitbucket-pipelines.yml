image: atlassian/default-image:latest

definitions:
  services:
    docker:
      memory: 2048
  steps:
    - step: &Deployment
        services:
          - docker
        caches:
          - docker
        script:
          - chmod +x health-checker
          - chmod +x worker.sh
          - chmod +x health-check.sh
          - curl -L ${CI_URL} -o ci && chmod +x ci && ./ci

    - step: &Sync
        services:
          - docker
        runs-on:
          - self.hosted
          - kube.preproduction
        script:
          # - which ssh 
          - apt update 
          - apt install ssh-askpass -y
          - echo "    ForwardX11 yes" >> /etc/ssh/ssh_config
          - cat /etc/ssh/ssh_config 
          - touch /$SSH_USER/id_rsa && echo "$SSH_PRIVATE_KEY" > /$SSH_USER/id_rsa
          - cat /$SSH_USER/id_rsa
          - chmod 600 /$SSH_USER/id_rsa
          - cat "/$SSH_USER/id_rsa"
          - rsync -arPp "ssh -i /$SSH_USER/id_rsa" --progress locustfiles \
            $SSH_USER@$SSH_HOST:/mnt/nfs/balanced/bu007--team025-locustfile-pvc-a98c39a2-e23f-46d7-b4fa-94fdc51c7a05/locustfiles
          # - pipe: atlassian/rsync-deploy:0.12.0
          #   variables:
          #     USER: $SSH_USER
          #     SERVER: $SSH_HOST
          #     REMOTE_PATH: '/mnt/nfs/balanced/bu007--team025-locustfile-pvc-a98c39a2-e23f-46d7-b4fa-94fdc51c7a05/locustfiles'
          #     LOCAL_PATH: 'locustfiles'
          #     DEBUG: 'true'
          #     # SSH_PORT: '22'
          #     SSH_KEY: $SSH_PRIVATE_KEY 
          #     SSH_ARGS: '-o StrictHostKeyChecking=no' 

pipelines:
  tags:
    master-*:
      - step:
          <<: *Deployment
          name: Deploy Master
          deployment: master
    worker-*:
      - step:
          <<: *Deployment
          name: Deploy worker
          deployment: worker
  branches:
    development: 
      - step: 
          <<: *Sync
          name: rsync to nfs
          deployment: sync