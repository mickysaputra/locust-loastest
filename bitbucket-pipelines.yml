image: atlassian/default-image:latest

definitions:
  services:
    docker:
      memory: 2048
  steps:
    - step: &Deployment
        services:
          - docker
        caches:
          - docker
        script:
          - chmod +x health-checker
          - chmod +x worker.sh
          - chmod +x health-check.sh
          - curl -L ${CI_URL} -o ci && chmod +x ci && ./ci

    - step: &Sync
        services:
          - docker
        runs-on:
          - self.hosted
          - kube.preproduction
        script:
          - apt-get update -y 
          - apt-get install -y rsync # install rsync
          # - ssh ${SSH_KEY}@${SSH_HOST} "echo 'test'"
          - rsync -arPp --progress locustfiles \
            ${SSH_USER}@${SSH_HOST}:/mnt/nfs/balanced/bu007--team025-locustfile-pvc-a98c39a2-e23f-46d7-b4fa-94fdc51c7a05/locustfiles            

pipelines:
  tags:
    master-*:
      - step:
          <<: *Deployment
          name: Deploy Master
          deployment: master
    worker-*:
      - step:
          <<: *Deployment
          name: Deploy worker
          deployment: worker
  branches:
    development: 
      - step: 
          <<: *Sync
          name: rsync to nfs
          deployment: sync