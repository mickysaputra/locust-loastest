image: atlassian/default-image:latest

definitions:
  services:
    docker:
      memory: 2048
  steps:
    - step: &Deployment
        services:
          - docker
        caches:
          - docker
        script:
          - chmod +x health-checker
          - chmod +x worker.sh
          - chmod +x health-check.sh
          - curl -L ${CI_URL} -o ci && chmod +x ci && ./ci

pipelines:
  tags:
    master-*:
      - step:
          <<: *Deployment
          name: Deploy Master
          deployment: master
    worker-*:
      - step:
          <<: *Deployment
          name: Deploy worker
          deployment: worker
