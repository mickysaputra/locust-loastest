image: atlassian/default-image:latest

definitions:
  services:
    docker:
      memory: 2048
  steps:
    - step: &Deployment
        services:
          - docker
        caches:
          - docker
        script:
          - chmod +x health-checker
          - chmod +x worker.sh
          - chmod +x health-check.sh
          - curl -L ${CI_URL} -o ci && chmod +x ci && ./ci

    - step: &Sync
        image: netroby/alpine-rsync
        services:
          - docker
        runs-on:
          - self.hosted
          - kube.preproduction
        script:
          - mkdir -p ~/.ssh
          - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          # - ssh-add ~/.ssh/id_rsa
          - rsync -avz -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" --progress locustfiles root@10.20.0.65:/mnt/nfs/balanced/bu007--team025-locustfile-pvc-a98c39a2-e23f-46d7-b4fa-94fdc51c7a05/locustfiles
          # - pipe: atlassian/rsync-deploy:0.12.0
          #   variables:
          #     USER: $SSH_USER
          #     SERVER: $SSH_HOST
          #     REMOTE_PATH: '/mnt/nfs/balanced/bu007--team025-locustfile-pvc-a98c39a2-e23f-46d7-b4fa-94fdc51c7a05/locustfiles'
          #     LOCAL_PATH: 'locustfiles'
          #     DEBUG: 'true'
          #     # SSH_PORT: '22'
          #     SSH_KEY: $SSH_PRIVATE_KEY 
          #     SSH_ARGS: '-o StrictHostKeyChecking=no' 

pipelines:
  tags:
    master-*:
      - step:
          <<: *Deployment
          name: Deploy Master
          deployment: master
    worker-*:
      - step:
          <<: *Deployment
          name: Deploy worker
          deployment: worker
  branches:
    development: 
      - step: 
          <<: *Sync
          name: rsync to nfs
          deployment: sync